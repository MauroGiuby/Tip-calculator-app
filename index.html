<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asimovian&display=swap" rel="stylesheet">
    
    <title>Frontend Mentor | Tip calculator app</title>

    <link rel="stylesheet" href="/reset.css">
    <link rel="stylesheet" href="/variables.css">
    <link rel="stylesheet" href="/style.css">

    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="main">
      <img class="main__logo" src="images/logo.svg" alt="Splitter">
      <h1 class="main__title visually-hidden">Tip calculator</h1>

      <form class="form" action="">

        <div class="form__section form__section--bill">
          <div class="form__group">

            <div class="form__label-container">

              <label for="bill" class="form__label">Bill</label>

              <!-- Messaggio di errore (gestito via JS) -->
              <span id="bill-warning" class="form__warning warning-bill">Can't be empty</span>

            </div>

            <!-- 
              Campo numerico per inserire l'importo del conto.
              È un input fondamentale per il calcolo della mancia.
            -->
            <input type="number"
            name="bill"
            id="bill"
            class="form__input form__input-bill"
            placeholder="0"
            aria-describedby="bill-warning"
            >

            <!-- type: Specifica che l’input accetta solo numeri -->
            <!-- name: Nome del campo, utile per form submission -->
            <!-- id: ID univoco, necessario per collegare il <label> -->  
            <!-- class: Classi BEM per styling -->
            <!-- placeholder: Valore visibile quando il campo è vuoto -->
            <!-- aria-describedby: Attributo ARIA che collega l’input al messaggio di errore.
            Migliora l’accessibilità per screen reader.
            -->
          </div>
        </div>







      </form>

    </main>


    Bill

    Select Tip %
    5%
    10%
    15%
    25%
    50%
    Custom

    Number of People

    Tip Amount
    / person

    Total
    / person

    <button type="reset" class="form__button">Reset</button>


    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">MauroGiannubilo</a>.
    </footer>

  </body>
</html>
