<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asimovian&display=swap" rel="stylesheet">
    
    <title>Frontend Mentor | Tip calculator app</title>

    <link rel="stylesheet" href="/reset.css">
    <link rel="stylesheet" href="/variables.css">
    <link rel="stylesheet" href="/style.css">

    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="main">
      <img class="main__logo" src="images/logo.svg" alt="Splitter">
      <h1 class="main__title visually-hidden">Tip calculator</h1>

      <!-- FORM PRINCIPALE -->
      <form class="form" action="">
        <!-- SEZIONE BILL -->
        <div class="form__section form__section--bill">
          <div class="form__group">

            <div class="form__label-container">

              <!-- 
                Il tag <label> collega un testo descrittivo a un input del form
                The <label> tag links a descriptive text to a form input field 
              -->
              <label for="bill" class="form__label">Bill</label>

              <!--
                Messaggio di errore (gestito via JS)
                Elemento inline generico, usato per contenuti brevi

                Error message (handled via JS)
                Generic inline element, used for short text content
              -->
              <span id="bill-warning" class="form__warning warning-bill">Can't be empty</span>

            </div>

            <!-- 
              Campo numerico per inserire l'importo del conto.
              È un input fondamentale per il calcolo della mancia.

              Numeric input field for entering the bill amount. 
              This value is essential for calculating the tip.
            -->
            <input type="number"
              name="bill"
              id="bill"
              class="form__input form__input-bill"
              placeholder="0"
              aria-describedby="bill-warning"
            >

            <!-- 
              IT: type — Specifica che l’input accetta solo numeri.
              EN: type — Specifies that the input accepts numeric values only.
            -->

            <!-- 
              IT: name — Nome del campo, utile per la gestione dei dati del form.
              EN: name — Field name, used when processing or submitting form data.
            -->

            <!-- 
              IT: id — Identificatore univoco, necessario per collegare il <label>.
              EN: id — Unique identifier, required to associate the field with its <label>.
            -->

            <!-- 
              IT: class — Classi BEM utilizzate per lo styling modulare e scalabile.
              EN: class — BEM classes used for modular and scalable styling.
            -->

            <!-- 
              IT: placeholder — Valore di esempio mostrato quando il campo è vuoto.
              EN: placeholder — Example value shown when the field is empty.
            -->

            <!-- 
              IT: aria-describedby — Collega l’input a un messaggio di supporto o errore,
                  migliorando l’accessibilità per gli screen reader.
              EN: aria-describedby — Links the input to a helper or error message,
                  improving accessibility for screen readers.
            -->

          </div>

          <!-- SEZIONE TIP -->
          <!-- 
            IT: <fieldset> — Raggruppa campi correlati all’interno di un form.
                Migliora la struttura semantica e l’accessibilità, soprattutto
                quando si usano radio button o checkbox. Da usare insieme a <legend>.
                
            EN: <fieldset> — Groups related form fields together.
                Enhances semantic structure and accessibility, especially
                when using radio buttons or checkboxes. Typically paired with <legend>.
          -->
          <fieldset class="form__group form__group--tip">
            <!-- Legend per accessibilità -->
             <legend class="form__label form__label-tip">Select Tip %</legend>

             <div class="form__tip-options">
              <label class="form__tip-label" for="tip-5"></label>
              <input 
                type="radio"
                name="tip-5"
                id="tip"
                value="5"
                class="form__tip-input"
                >

             </div>
              


          </fieldset>



        </div>







      </form>

    </main>


    Bill

    Select Tip %
    5%
    10%
    15%
    25%
    50%
    Custom

    Number of People

    Tip Amount
    / person

    Total
    / person

    <button type="reset" class="form__button">Reset</button>


    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="#">MauroGiannubilo</a>.
    </footer>

  </body>
</html>
